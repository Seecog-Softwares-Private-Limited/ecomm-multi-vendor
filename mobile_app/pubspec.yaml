name: indovyapar_customer
description: "Indovyapar customer shopping app"
publish_to: 'none'

# Play Store version — SINGLE SOURCE OF TRUTH for Android & iOS.
# Format: versionName+versionCode  (e.g. 1.0.3+7 → name 1.0.3, code 7)
# Android reads these via flutter.versionName / flutter.versionCode in build.gradle.kts.
# iOS reads FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER from Info.plist.
# Increment versionCode on EVERY Play upload (must be higher than the live Play Store release).
version: 1.0.7+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Dependency injection
  get_it: ^9.2.1

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Env config
  flutter_dotenv: ^5.2.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.3.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  lottie: ^3.5.0
  equatable: ^2.1.0

  # Payments
  razorpay_flutter: ^1.4.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/env/.env.dev
    - assets/env/.env.prod
    - assets/images/

# Home-screen / launcher icon (Android + iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

# Native splash shown before Flutter paints (replaces default Flutter branding)
flutter_native_splash:
  color: "#1B7A43"
  image: assets/images/app_icon.png
  color_dark: "#135C32"
  image_dark: assets/images/app_icon.png
  android_12:
    color: "#1B7A43"
    icon_background_color: "#1B7A43"
    image: assets/images/app_icon.png
    color_dark: "#135C32"
    icon_background_color_dark: "#135C32"
    image_dark: assets/images/app_icon.png
  web: false
  fullscreen: true