name: indovyapar_customer
description: "Indovyapar customer shopping app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Dependency injection
  get_it: ^9.2.1

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.10.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Env config
  flutter_dotenv: ^5.2.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.3.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  lottie: ^3.5.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/env/.env.dev
    - assets/env/.env.prod
