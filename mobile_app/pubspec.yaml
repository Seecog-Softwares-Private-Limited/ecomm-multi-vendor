name: indovyapar_customer
description: "Indovyapar customer app — WebView container for indovyapar.com"
publish_to: 'none'

# Play Store version — SINGLE SOURCE OF TRUTH for Android & iOS.
# Format: versionName+versionCode  (e.g. 1.0.3+7 → name 1.0.3, code 7)
version: 1.0.8+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Website container
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0

  # External schemes (tel:, mailto:, UPI, unknown https hosts)
  url_launcher: ^6.3.2

  # Android WebView <input type="file"> chooser
  file_picker: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Home-screen / launcher icon (Android + iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

# Native splash shown before Flutter paints (replaces default Flutter branding)
flutter_native_splash:
  color: "#1B7A43"
  image: assets/images/app_icon.png
  color_dark: "#135C32"
  image_dark: assets/images/app_icon.png
  android_12:
    color: "#1B7A43"
    icon_background_color: "#1B7A43"
    image: assets/images/app_icon.png
    color_dark: "#135C32"
    icon_background_color_dark: "#135C32"
    image_dark: assets/images/app_icon.png
  web: false
  fullscreen: true
